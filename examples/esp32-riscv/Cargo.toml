[package]
name = "yodel-esp32-riscv-examples"
version = "0.1.0"
edition = "2024"
publish = false
description = "Copy-paste APRS beacon (modulation), decoder (demodulation) and WIDEn-N digipeater examples for ESP32-class RISC-V bare-metal targets, built on yodel"
license = "MIT OR Apache-2.0"

# This empty [workspace] table DETACHES the sub-crate from any parent
# workspace lookup: the repository root is a plain single crate, and this
# examples crate must stay independent so it can pin its own (bare-metal)
# target without dragging the host test suite along.
[workspace]

[dependencies]
# The only dependency: the modem crate itself, by path, with the minimal
# feature set. `tnc` is the high-level pipeline feature and transitively
# enables everything these examples need (`aprs` -> `ax25` -> `nrzi`,
# plus `mod` and `demod`); `digipeat` adds the WIDEn-N relay-decision
# core and dupe ring used by the digipeater example. Default features
# are disabled so nothing std-flavored can sneak in.
yodel = { path = "../..", default-features = false, features = ["tnc", "digipeat"] }

[lib]
# A library (not a binary) on purpose: it cross-compiles for bare-metal
# targets without needing a panic handler, linker script, or runtime
# crate. See src/lib.rs for the full rationale and how to turn the
# modules into a firmware binary with your HAL.
crate-type = ["lib"]
